plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-kapt'
}

android {
    namespace = "com.miapp.custodio2"
    compileSdk = 35
    //la version anterior era la 3.7.0
    defaultConfig {
        applicationId = "com.miapp.custodio2"
        minSdk = 24
        targetSdk = 35
        versionCode = 11
        versionName = "3.8.4MARZO"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled=false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }
    compileOptions {
        //sourceCompatibility=JavaVersion.VERSION_1_8
        //targetCompatibility=JavaVersion.VERSION_1_8
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        //jvmTarget = '1.8'
        jvmTarget = "17"
    }

    viewBinding {
        enabled = true
    }
}

dependencies {

    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.9.1')
    implementation('androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1')
    implementation('androidx.core:core-ktx:1.16.0')
    implementation('androidx.appcompat:appcompat:1.5.1')
    implementation('com.google.android.material:material:1.12.0')
    implementation('androidx.constraintlayout:constraintlayout:2.1.4')
    implementation('com.google.android.gms:play-services-location:21.3.0')
    implementation('com.google.android.gms:play-services-cast-framework:22.1.0')
    //Material Design
    //implementation('com.google.android.material:material:1.7.0')
    //Firebase
    implementation(platform('com.google.firebase:firebase-bom:33.15.0'))
    implementation('com.google.firebase:firebase-analytics-ktx')
    //Firebase - Messaging
    implementation('com.google.firebase:firebase-messaging-ktx:24.1.1')
    //Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4")

    implementation('androidx.activity:activity:1.10.1')
    implementation('androidx.fragment:fragment:1.5.5')
    //For request
    implementation('com.squareup.retrofit2:retrofit:2.9.0')
    implementation('com.squareup.okhttp3:okhttp:4.9.3')
    //implementation('com.google.code.gson:gson:2.8.9')
    implementation("com.google.code.gson:gson:2.13.1")
    //Pick image from gallery / photo Git
    implementation('com.github.dhaval2404:imagepicker:2.1')
    //Crash analitycs
    implementation(platform('com.google.firebase:firebase-bom:33.15.0'))
    implementation('com.google.firebase:firebase-analytics-ktx')
    implementation('com.google.firebase:firebase-crashlytics-ktx')

    implementation("androidx.work:work-runtime-ktx:2.10.2")
    //Progress bar
    //implementation('com.github.Turaiiao:FuckProgress:0.0.2')
    //Glide
    implementation('com.github.bumptech.glide:glide:4.13.0')
    kapt('com.github.bumptech.glide:compiler:4.13.0')
    //Loading
    implementation("com.github.techinessoverloaded:progress-dialog:1.5.1")

    //Para poder usar AppUpdate
    //implementation('com.google.android.play:core:1.10.3')
    implementation("com.google.android.play:app-update-ktx:2.1.0")
    implementation('com.android.billingclient:billing:7.0.0')

    testImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test.ext:junit:1.1.4')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.0')
}